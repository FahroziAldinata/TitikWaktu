name: titik_waktu
description: Aplikasi Jadwal & Alarm Kegiatan dengan pengulangan fleksibel
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Local Database
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.18
  
  # Alarm & Notifications
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  
  # Recurrence Rules
  rrule: ^0.2.12
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.2.1
  path_provider: ^2.1.2
  permission_handler: ^11.1.0
  logger: ^2.0.2
  
  # UI Components
  flutter_slidable: ^3.0.1
  flutter_staggered_animations: ^1.1.1
  go_router: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.7
  drift_dev: ^2.28.0
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  
  # Testing
  mocktail: ^1.0.1
  fake_async: ^1.3.1
  
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1C1C1A"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_monochrome: "assets/icon/monochrome.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/sounds/
    - assets/images/
    - assets/icon/
  
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
